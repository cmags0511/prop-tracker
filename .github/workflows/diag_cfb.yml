name: CFB diagnostic (one-off)
on:
  push:
    branches: [cfb-diag]
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - env:
          ODDSPAPI_KEY: ${{ secrets.ODDSPAPI_KEY }}
        run: |
          mkdir -p backtest_results
          python diag_cfb.py 2>&1 | tee backtest_results/diag_cfb.txt
      - run: |
          git config user.name github-actions
          git config user.email actions@github.com
          git add backtest_results/diag_cfb.txt
          git commit -m "CFB diag result" || true
          git push || true
