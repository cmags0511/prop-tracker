name: probe7
on: {push: {branches: [probe-soc]}}
permissions: {contents: write}
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p out && python p.py 2>&1 | tee out/log.txt
      - run: |
          git config user.name probe; git config user.email probe@users.noreply.github.com
          git checkout -b probe-soc-out; git add out; git commit -qm out; git push -q origin probe-soc-out
          sleep 300
          git push origin --delete probe-soc-out probe-soc || true
