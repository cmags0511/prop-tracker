name: Refresh lines

# Hourly: DraftKings lines (ESPN feed) and Kalshi prices, then re-rank and re-lock the picks.
# The full data rebuild (game logs, college, injuries, weather) stays on the 3-hour "Update prop data" job.
on:
  schedule:
    - cron: "47 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: data-commit
  cancel-in-progress: false

jobs:
  lines:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: DraftKings lines from ESPN
        run: python fetch_lines.py lines.json
        continue-on-error: true
      - name: Kalshi prices
        run: python fetch_markets.py markets.json
        continue-on-error: true
      - name: Rank top picks
        run: python picks.py picks.json
        continue-on-error: true
      - name: Lock and grade the app's Top 10
        run: python record.py record.json
        continue-on-error: true
      - name: Commit if changed
        run: |
          git config user.name "prop-tracker-bot"
          git config user.email "prop-tracker-bot@users.noreply.github.com"
          git add $(ls lines.json markets.json picks.json slate.json record.json 2>/dev/null)
          git diff --cached --quiet || git commit -m "Refresh lines $(date -u +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase -X theirs origin main || true
          git push
