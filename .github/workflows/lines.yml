name: Refresh lines

# Hourly: DraftKings lines (ESPN feed) and Kalshi prices, then re-rank and re-lock the picks.
# The full data rebuild (game logs, college, injuries, weather) stays on the 3-hour "Update prop data" job.
on:
  schedule:
    - cron: "47 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: data-commit
  cancel-in-progress: false

jobs:
  lines:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: DraftKings lines from ESPN
        id: fetch_lines
        run: python fetch_lines.py lines.json
        continue-on-error: true
      - name: Injury reports (game-day inactives show up here as Out)
        id: fetch_context
        run: python fetch_context.py context.json
        continue-on-error: true
      - name: Kalshi prices
        id: fetch_markets
        run: python fetch_markets.py markets.json
        continue-on-error: true
      - name: Sportsbook prices for player props (Pinnacle's public odds, no key needed)
        id: fetch_prices
        run: python fetch_prices.py odds.json
        continue-on-error: true
      - name: Rank top picks
        id: picks
        run: python picks.py picks.json
        continue-on-error: true
      - name: Sportsbook prices for the top picks (The Odds API, only if a key is set)
        id: fetch_odds
        run: python fetch_odds.py odds.json && python picks.py picks.json
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        continue-on-error: true
      - name: Soccer props (DraftKings prices via ESPN, every league)
        id: soccer_data
        run: python soccer_data.py --light
        continue-on-error: true
      - name: Lock and grade the app's Top 10
        id: record
        run: python record.py record.json
        continue-on-error: true
      - name: Walters-style NFL lines (fair spreads, lock and grade picks)
        id: walters
        run: python walters.py walters.json
        continue-on-error: true
      - name: Record which steps worked (the app shows a warning when a data step fails)
        if: always()
        run: |
          cat > /tmp/steps.json <<'JSON'
          ${{ toJSON(steps) }}
          JSON
          python -c "import json,datetime;s=json.load(open('/tmp/steps.json'));json.dump({'at':datetime.datetime.now(datetime.timezone.utc).isoformat(timespec='minutes'),'steps':{k:v['outcome'] for k,v in s.items()}},open('health_lines.json','w'))"
      - name: Commit if changed
        run: |
          git config user.name "prop-tracker-bot"
          git config user.email "prop-tracker-bot@users.noreply.github.com"
          git add $(ls health_lines.json context.json lines.json markets.json odds.json picks.json slate.json record.json calib.json closing.json soccer.json soccer_close.json walters.json 2>/dev/null)
          git diff --cached --quiet || git commit -m "Refresh lines $(date -u +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase -X theirs origin main || true
          git push
