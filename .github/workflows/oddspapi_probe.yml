name: OddsPapi probe (one-off)
on:
  push:
    branches: [oddspapi-probe]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Probe
        env:
          ODDSPAPI_KEY: ${{ secrets.ODDSPAPI_KEY }}
        run: |
          mkdir -p backtest_results
          python oddspapi_probe.py 2>&1 | tee backtest_results/oddspapi_probe.txt
      - name: Commit result
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add backtest_results/oddspapi_probe.txt
          git commit -m "OddsPapi probe result" || true
          git push || true
