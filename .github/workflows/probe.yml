name: probe
on: push
jobs:
  p:
    runs-on: ubuntu-24.04
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      - run: python probe_fd.py > probe_log.txt 2>&1 || true
      - run: |
          git config user.name probe; git config user.email probe@users.noreply.github.com
          git checkout -b probe-out-${{ github.run_id }}
          git add -f probe_fd.json probe_log.txt || git add -f probe_log.txt; git commit -qm probe; git push origin probe-out-${{ github.run_id }}
