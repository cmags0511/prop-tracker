name: API-SPORTS probe (branch only)

# One-off: asks API-SPORTS' free plan what it returns (quota headers per sport host, injuries, games, odds) and commits the
# printout to backtest_results/apisports_probe.txt on the apisports-probe branch. Needs the APISPORTS_KEY secret.
on:
  workflow_dispatch: {}
  push:
    branches: ["apisports-probe"]
    paths: ["apisports_probe.py", ".github/workflows/apisports_probe.yml"]

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Probe
        env:
          APISPORTS_KEY: ${{ secrets.APISPORTS_KEY }}
        run: |
          mkdir -p backtest_results
          python apisports_probe.py 2>&1 | tee backtest_results/apisports_probe.txt
        continue-on-error: true
      - name: Commit the printout
        run: |
          git config user.name "prop-tracker-bot"
          git config user.email "prop-tracker-bot@users.noreply.github.com"
          git add backtest_results/apisports_probe.txt
          git diff --cached --quiet || git commit -m "API-SPORTS probe printout"
          git pull --rebase origin "${GITHUB_REF_NAME}" || true
          git push origin "HEAD:${GITHUB_REF_NAME}"
