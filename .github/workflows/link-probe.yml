name: Odds link probe (temporary)
on:
  push:
    branches: [odds-link-probe]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Run the one-credit probe
        run: python probe_tmp/link_probe.py
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        continue-on-error: true
      - run: |
          git config user.name "prop-tracker-bot"
          git config user.email "prop-tracker-bot@users.noreply.github.com"
          git add -A probe_tmp
          git commit -m "Odds link probe output" || true
          git pull --rebase origin odds-link-probe || true
          git push
