name: CFB backtest

# One-off research run: downloads CollegeFootballData.com data with the CFBD_API_KEY secret (free key), runs
# backtest_cfb.py and commits the printed results to backtest_results/cfb.txt. Run it by hand (Actions tab).
# The API responses are cached between runs so repeat runs don't use up the free monthly call allowance.
on:
  workflow_dispatch: {}
  push:
    branches: ["cfb-backtest-run"]
    paths: ["backtest_cfb.py", ".github/workflows/backtest_cfb.yml"]

permissions:
  contents: write

concurrency:
  group: cfb-backtest
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install numpy
      - name: Restore cached API responses
        uses: actions/cache/restore@v4
        with:
          path: backtest_data
          key: cfbd-data-${{ github.run_id }}
          restore-keys: cfbd-data-
      - name: Run the backtest
        id: bt
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: |
          mkdir -p backtest_results
          python backtest_cfb.py backtest_data 2>&1 | tee backtest_results/cfb.txt
        continue-on-error: true
      - name: Save cached API responses
        if: always()
        uses: actions/cache/save@v4
        with:
          path: backtest_data
          key: cfbd-data-${{ github.run_id }}
      - name: Commit the results
        if: always()
        run: |
          git config user.name "prop-tracker-bot"
          git config user.email "prop-tracker-bot@users.noreply.github.com"
          git add backtest_results/cfb.txt
          git diff --cached --quiet || git commit -m "CFB backtest results (${{ steps.bt.outcome }})"
          git pull --rebase origin "${GITHUB_REF_NAME}" || true
          git push origin "HEAD:${GITHUB_REF_NAME}"
